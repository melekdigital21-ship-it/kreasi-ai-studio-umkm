<script>
  window.addEventListener('message', (event) => {
    if (!event.data || event.data.action !== 'kembali-portal') return;

    // Sesuaikan selector ini dengan wrapper / iframe studio di index.html Anda
    const iframeWrapper = document.getElementById('studioIframeWrapper') || document.querySelector('.studio-iframe-wrap');
    const iframeEl = document.getElementById('studioIframe') || document.querySelector('iframe');
    const berandaSection = document.getElementById('berandaPortal') || document.querySelector('.portal-home');

    if (iframeWrapper) {
      iframeWrapper.hidden = true;
      iframeWrapper.style.display = 'none';
    }
    if (iframeEl) {
      iframeEl.src = 'about:blank';
    }
    if (berandaSection) {
      berandaSection.hidden = false;
      berandaSection.style.display = '';
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
